<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Inter, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <style>
      .box { rx: 6; ry: 6; }
      .label { font-weight: 600; fill: #1e293b; font-size: 12px; }
      .detail { fill: #475569; font-size: 10.5px; }
      .op { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .mat { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; }
      .sensor { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.5; }
      .check { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .run { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .skip { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="390" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Dagster: Materialization → Sensor → Pipeline Triggering</text>

  <!-- Column 1: Upstream pipeline -->
  <text x="130" y="50" text-anchor="middle" class="label" font-size="13" fill="#64748b">Upstream Pipeline (producer)</text>

  <rect x="30" y="62" width="200" height="44" class="box op"/>
  <text x="130" y="80" text-anchor="middle" class="label">sl_job() — @op</text>
  <text x="130" y="96" text-anchor="middle" class="detail">executes Starlake CLI command</text>

  <line x1="130" y1="106" x2="130" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="30" y="132" width="200" height="66" class="box mat"/>
  <text x="130" y="150" text-anchor="middle" class="label">AssetMaterialization</text>
  <text x="50" y="168" class="detail">asset_key = AssetKey(uri)</text>
  <text x="50" y="182" class="detail">metadata: sl_uri, sl_cron,</text>
  <text x="60" y="194" class="detail">sl_freshness, sl_scheduled_date</text>

  <line x1="130" y1="198" x2="130" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="30" y="224" width="200" height="44" class="box mat"/>
  <text x="130" y="242" text-anchor="middle" class="label">partition = logical_datetime</text>
  <text x="130" y="258" text-anchor="middle" class="detail">tags: PARTITION_NAME, data_interval_end</text>

  <!-- Arrow to sensor -->
  <line x1="230" y1="170" x2="320" y2="170" stroke="#9333ea" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6"/>
  <text x="275" y="162" text-anchor="middle" class="detail" fill="#9333ea">polls</text>

  <!-- Column 2: Sensor -->
  <text x="480" y="50" text-anchor="middle" class="label" font-size="13" fill="#64748b">MultiAssetSensorDefinition</text>

  <rect x="320" y="62" width="320" height="44" class="box sensor"/>
  <text x="480" y="80" text-anchor="middle" class="label">latest_materialization_records_by_key()</text>
  <text x="480" y="96" text-anchor="middle" class="detail">monitored_assets = [AssetKey(uri) for each dataset]</text>

  <line x1="480" y1="106" x2="480" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="320" y="132" width="320" height="56" class="box sensor"/>
  <text x="480" y="150" text-anchor="middle" class="label">Strategy check</text>
  <text x="340" y="168" class="detail">ALL → all assets materialized?</text>
  <text x="340" y="182" class="detail">ANY → at least one materialized?</text>

  <line x1="480" y1="188" x2="480" y2="214" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="320" y="214" width="320" height="56" class="box sensor"/>
  <text x="480" y="232" text-anchor="middle" class="label">Identify freshest dataset</text>
  <text x="340" y="250" class="detail">→ extract partition from materialization</text>
  <text x="340" y="264" class="detail">→ max(scheduled_date) = anchor</text>

  <line x1="480" y1="270" x2="480" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="320" y="296" width="320" height="56" class="box check"/>
  <text x="480" y="314" text-anchor="middle" class="label">check_datasets_freshness()</text>
  <text x="340" y="332" class="detail">validate remaining datasets against anchor</text>
  <text x="340" y="346" class="detail">via instance.fetch_materializations()</text>

  <!-- Two outcomes -->
  <line x1="420" y1="352" x2="340" y2="400" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="540" y1="352" x2="620" y2="400" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="240" y="400" width="200" height="56" class="box run"/>
  <text x="340" y="418" text-anchor="middle" class="label" fill="#166534">RunRequest</text>
  <text x="260" y="436" class="detail" fill="#166534">partition_key = logical_datetime</text>
  <text x="260" y="450" class="detail" fill="#166534">run_config = _ops_config(...)</text>

  <rect x="520" y="400" width="200" height="56" class="box skip"/>
  <text x="620" y="418" text-anchor="middle" class="label" fill="#64748b">SkipReason</text>
  <text x="540" y="436" class="detail" fill="#64748b">"datasets not consistent</text>
  <text x="540" y="450" class="detail" fill="#64748b"> with freshest materialization"</text>

  <!-- Arrow from RunRequest to downstream -->
  <line x1="340" y1="456" x2="340" y2="486" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="240" y="486" width="200" height="28" class="box op"/>
  <text x="340" y="504" text-anchor="middle" class="label">Downstream pipeline runs</text>
</svg>
