<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="Inter, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <style>
      .box { rx: 6; ry: 6; }
      .label { font-weight: 600; fill: #1e293b; font-size: 12px; }
      .detail { fill: #475569; font-size: 10.5px; }
      .sl { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .dg { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #475569; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="370" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">DagsterPipeline.__exit__(): Starlake Tree → Dagster Graph</text>

  <!-- Left: Starlake model -->
  <text x="170" y="50" text-anchor="middle" class="label" font-size="13" fill="#3b82f6">Starlake Dependency Tree</text>

  <rect x="100" y="64" width="140" height="32" class="box sl"/>
  <text x="170" y="84" text-anchor="middle" class="label">AbstractPipeline</text>

  <line x1="140" y1="96" x2="100" y2="120" class="arrow" marker-end="url(#b)"/>
  <line x1="200" y1="96" x2="240" y2="120" class="arrow" marker-end="url(#b)"/>

  <rect x="30" y="120" width="140" height="32" class="box sl"/>
  <text x="100" y="140" text-anchor="middle" class="detail">AbstractTaskGroup</text>

  <rect x="190" y="120" width="110" height="32" class="box sl"/>
  <text x="245" y="140" text-anchor="middle" class="detail">AbstractTask</text>

  <line x1="70" y1="152" x2="50" y2="176" class="arrow" marker-end="url(#b)"/>
  <line x1="130" y1="152" x2="150" y2="176" class="arrow" marker-end="url(#b)"/>

  <rect x="10" y="176" width="80" height="28" class="box sl"/>
  <text x="50" y="194" text-anchor="middle" class="detail">Task A</text>

  <rect x="110" y="176" width="80" height="28" class="box sl"/>
  <text x="150" y="194" text-anchor="middle" class="detail">Task B</text>

  <text x="100" y="230" text-anchor="middle" class="detail" fill="#94a3b8">upstreams / downstreams</text>
  <text x="100" y="244" text-anchor="middle" class="detail" fill="#94a3b8">roots / leaves</text>
  <text x="100" y="258" text-anchor="middle" class="detail" fill="#94a3b8">>> / &lt;&lt; operators</text>

  <!-- Arrow transform -->
  <line x1="310" y1="140" x2="390" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>
  <text x="350" y="130" text-anchor="middle" class="label" fill="#475569">update_</text>
  <text x="350" y="156" text-anchor="middle" class="label" fill="#475569">graph_def()</text>

  <!-- Right: Dagster model -->
  <text x="560" y="50" text-anchor="middle" class="label" font-size="13" fill="#9333ea">Dagster GraphDefinition</text>

  <rect x="400" y="64" width="320" height="80" class="box dg"/>
  <text x="560" y="84" text-anchor="middle" class="label">GraphDefinition(name, ...)</text>
  <text x="420" y="102" class="detail">node_defs: [OpDefinition, GraphDefinition, ...]</text>
  <text x="420" y="118" class="detail">dependencies: {node: {input: DependencyDefinition}}</text>
  <text x="420" y="134" class="detail">input_mappings / output_mappings</text>

  <line x1="480" y1="144" x2="460" y2="176" class="arrow" marker-end="url(#b)"/>
  <line x1="640" y1="144" x2="660" y2="176" class="arrow" marker-end="url(#b)"/>

  <rect x="400" y="176" width="120" height="46" class="box dg"/>
  <text x="460" y="196" text-anchor="middle" class="label">OpDefinition</text>
  <text x="460" y="212" text-anchor="middle" class="detail">ins: {result: In(str)}</text>

  <rect x="600" y="176" width="120" height="46" class="box dg"/>
  <text x="660" y="196" text-anchor="middle" class="label">OpDefinition</text>
  <text x="660" y="212" text-anchor="middle" class="detail">outs: {result: Out(str)}</text>

  <text x="560" y="248" text-anchor="middle" class="detail" fill="#94a3b8">DependencyDefinition wires</text>
  <text x="560" y="262" text-anchor="middle" class="detail" fill="#94a3b8">upstream Out → downstream In</text>

  <!-- Bottom: Key insight -->
  <rect x="120" y="290" width="500" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="312" text-anchor="middle" class="label" fill="#92400e">Key: Dagster ops are immutable</text>
  <text x="370" y="330" text-anchor="middle" class="detail" fill="#92400e">copy_node_with_new_inputs() creates new OpDefinition copies with injected inputs for wiring</text>
</svg>
