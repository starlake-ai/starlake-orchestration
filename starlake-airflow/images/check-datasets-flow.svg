<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" font-family="Inter, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <style>
      .box { rx: 6; ry: 6; }
      .label { font-weight: 600; fill: #1e293b; font-size: 12px; }
      .detail { fill: #475569; font-size: 10.5px; }
      .phase { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .db { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .decision { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .result-ok { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .result-skip { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .xcom { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Title -->
  <text x="380" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">check_datasets() — Core Validation Engine</text>

  <!-- Phase 1: Establish baseline -->
  <rect x="10" y="40" width="740" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="60" class="label" font-size="13" fill="#64748b">Phase 1: Establish Baseline</text>

  <rect x="30" y="72" width="320" height="46" class="box db"/>
  <text x="190" y="90" text-anchor="middle" class="label">find_previous_dag_runs(before)</text>
  <text x="190" y="106" text-anchor="middle" class="detail">→ previous_dag_checked</text>

  <rect x="400" y="72" width="320" height="46" class="box db"/>
  <text x="560" y="90" text-anchor="middle" class="label">find_previous_dag_runs(at_or_before)</text>
  <text x="560" y="106" text-anchor="middle" class="detail">→ last_dag_checked, last_dag_ts</text>

  <rect x="30" y="130" width="690" height="46" class="box db"/>
  <text x="375" y="148" text-anchor="middle" class="label">DB: session.query(DagRun).join(TaskInstance) — exclude skipped leaf tasks</text>
  <text x="375" y="164" text-anchor="middle" class="detail">Also: SerializedDagModel.get_dag(dag_id).leaves for leaf task IDs</text>

  <!-- Phase 2: Guard -->
  <rect x="10" y="200" width="740" height="70" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="30" y="220" class="label" font-size="13" fill="#92400e">Phase 2: Guard Against Rapid Re-execution</text>
  <text x="30" y="240" class="detail" fill="#78350f">IF last_dag_checked == scheduled_date AND (ts - last_dag_ts) &lt; min_timedelta_between_runs</text>
  <text x="30" y="256" class="detail" fill="#78350f">→ Return False (skip: just ran successfully for this slot)</text>

  <!-- Phase 3: Classify -->
  <rect x="10" y="280" width="740" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="300" class="label" font-size="13" fill="#64748b">Phase 3-4: Classify Datasets</text>
  <text x="30" y="318" class="detail">data_cycle_freshness = get_cron_frequency(job.data_cycle) if enabled</text>
  <text x="30" y="334" class="detail">most_frequent = most_frequent_crons(all dataset crons)</text>

  <!-- Phase 5: Per-dataset loop -->
  <rect x="10" y="360" width="740" height="420" rx="8" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="30" y="382" class="label" font-size="13" fill="#374151">Phase 5: FOR EACH dataset</text>

  <!-- Optional check -->
  <rect x="30" y="394" width="700" height="36" class="box decision"/>
  <text x="380" y="416" text-anchor="middle" class="detail">IF optional (dataset frequency &gt; data_cycle frequency) → skip this dataset</text>

  <!-- Scheduled branch -->
  <rect x="30" y="444" width="340" height="170" class="box phase"/>
  <text x="200" y="462" text-anchor="middle" class="label">Scheduled dataset (has cron)</text>
  <text x="50" y="482" class="detail">1. Compute (min, max) window from</text>
  <text x="60" y="496" class="detail">scheduled_dates_range(cron, scheduled_date)</text>
  <text x="50" y="514" class="detail">2. Adjust by previous_dag_checked</text>
  <text x="50" y="530" class="detail">3. Extend by ±freshness if beyond_data_cycle</text>
  <text x="50" y="548" class="detail">4. Check triggering dataset's datetime in range</text>
  <text x="50" y="566" class="detail">5. If not found: query DatasetEvent table</text>
  <text x="50" y="584" class="detail">6. If still not found → missing_datasets</text>

  <!-- Non-scheduled branch -->
  <rect x="390" y="444" width="340" height="170" class="box phase"/>
  <text x="560" y="462" text-anchor="middle" class="label">Non-scheduled dataset (no cron)</text>
  <text x="410" y="482" class="detail">1. Window = (previous_dag_checked - freshness,</text>
  <text x="420" y="496" class="detail">scheduled_date + freshness)</text>
  <text x="410" y="514" class="detail">2. Query DatasetEvent table for events</text>
  <text x="410" y="530" class="detail">3. Walk events in reverse order</text>
  <text x="410" y="548" class="detail">4. Find one with scheduled_datetime</text>
  <text x="420" y="562" class="detail">after previous_dag_checked</text>
  <text x="410" y="580" class="detail">5. If not found → missing_datasets</text>

  <!-- DB query box -->
  <rect x="30" y="628" width="700" height="36" class="box db"/>
  <text x="380" y="650" text-anchor="middle" class="label">DB: session.query(DatasetEvent).join(DagRun).join(DatasetModel).filter(uri, window, ts)</text>

  <!-- Phase 6 labels -->
  <rect x="30" y="678" width="700" height="88" rx="6" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
  <text x="380" y="698" text-anchor="middle" class="label" font-size="13" fill="#374151">Phase 6: Result</text>

  <rect x="50" y="710" width="300" height="44" class="box result-ok"/>
  <text x="200" y="728" text-anchor="middle" class="label" fill="#166534">All datasets found</text>
  <text x="200" y="744" text-anchor="middle" class="detail" fill="#166534">XCom push start/end → Return True</text>

  <rect x="400" y="710" width="300" height="44" class="box result-skip"/>
  <text x="550" y="728" text-anchor="middle" class="label" fill="#991b1b">Missing datasets</text>
  <text x="550" y="744" text-anchor="middle" class="detail" fill="#991b1b">→ Return False (skip DAG execution)</text>

  <!-- XCom output -->
  <rect x="140" y="800" width="480" height="50" class="box xcom"/>
  <text x="380" y="818" text-anchor="middle" class="label" fill="#1e40af">XCom Output (on success)</text>
  <text x="380" y="836" text-anchor="middle" class="detail" fill="#1e40af">data_interval_start = previous_dag_checked  |  data_interval_end = max_scheduled_date</text>

  <line x1="200" y1="754" x2="300" y2="800" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- DB warning -->
  <rect x="140" y="864" width="480" height="46" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="380" y="884" text-anchor="middle" class="label" font-size="11" fill="#991b1b">Airflow 3: Direct DB access via SQLAlchemy (@provide_session) is forbidden</text>
  <text x="380" y="900" text-anchor="middle" class="detail" fill="#991b1b">All DagRun, TaskInstance, DatasetEvent, DatasetModel queries must use the public API</text>
</svg>
