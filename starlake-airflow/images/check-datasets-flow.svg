<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1036" font-family="Inter, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <style>
      .box { rx: 6; ry: 6; }
      .label { font-weight: 600; fill: #1e293b; font-size: 12px; }
      .detail { fill: #475569; font-size: 10.5px; }
      .phase { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .db { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .decision { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .first { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .window { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .result-ok { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .result-skip { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .xcom { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Title -->
  <text x="380" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">check_datasets() — Core Validation Engine</text>

  <!-- Phase 1: Establish baseline -->
  <rect x="10" y="40" width="740" height="190" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="60" class="label" font-size="13" fill="#64748b">Phase 1: Establish Baseline</text>

  <rect x="30" y="72" width="320" height="46" class="box db"/>
  <text x="190" y="90" text-anchor="middle" class="label">find_previous_dag_runs(before)</text>
  <text x="190" y="106" text-anchor="middle" class="detail">→ previous_dag_checked (its data_interval_end)</text>

  <rect x="400" y="72" width="320" height="46" class="box db"/>
  <text x="560" y="90" text-anchor="middle" class="label">find_previous_dag_runs(at_or_before)</text>
  <text x="560" y="106" text-anchor="middle" class="detail">→ last_dag_checked, last_dag_ts</text>

  <rect x="30" y="128" width="690" height="34" class="box db"/>
  <text x="375" y="149" text-anchor="middle" class="detail">StarlakeAirflowApiClient: successful runs minus those with a SKIPPED leaf task (dag.leaves) — metadata DB on Airflow 2, REST v2 on Airflow 3</text>

  <rect x="30" y="172" width="690" height="48" class="box window"/>
  <text x="375" y="191" text-anchor="middle" class="detail">P_prev = the previous successful run's trigger time (run_after on Airflow 3, execution_date on Airflow 2), else its start_date, else previous_dag_checked</text>
  <text x="375" y="209" text-anchor="middle" class="detail">U = this run's trigger time (context["dag_run"]), else ts — neither bound moves when a run is cleared</text>

  <!-- Phase 2: Guard -->
  <rect x="10" y="240" width="740" height="70" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="30" y="260" class="label" font-size="13" fill="#92400e">Phase 2: Guard Against Rapid Re-execution</text>
  <text x="30" y="280" class="detail" fill="#78350f">IF last_dag_checked == scheduled_date AND (ts - last_dag_ts) &lt; min_timedelta_between_runs</text>
  <text x="30" y="296" class="detail" fill="#78350f">→ Return False (skip: just ran successfully for this slot)</text>

  <!-- Phase 3: Classify -->
  <rect x="10" y="320" width="740" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="340" class="label" font-size="13" fill="#64748b">Phase 3-4: Classify Datasets</text>
  <text x="30" y="358" class="detail">data_cycle_freshness = get_cron_frequency(job.data_cycle) if enabled</text>
  <text x="30" y="374" class="detail">most_frequent = most_frequent_crons(all dataset crons)</text>

  <!-- Phase 5: Per-dataset loop -->
  <rect x="10" y="400" width="740" height="496" rx="8" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="30" y="422" class="label" font-size="13" fill="#374151">Phase 5: FOR EACH dataset (every declared dataset, the anchor included)</text>

  <!-- Event-first check -->
  <rect x="30" y="434" width="700" height="48" class="box first"/>
  <text x="380" y="453" text-anchor="middle" class="label" fill="#166534">Event first: IF the dataset triggered the run AND its event declares no valid cron → retained</text>
  <text x="380" y="470" text-anchor="middle" class="detail" fill="#166534">by its presence — no lookup, data_cycle ignored; a readable sl_scheduled_date raises max_scheduled_date</text>

  <!-- Optional check -->
  <rect x="30" y="494" width="700" height="36" class="box decision"/>
  <text x="380" y="516" text-anchor="middle" class="detail">IF optional (dataset frequency &gt; data_cycle frequency) → skip this dataset</text>

  <!-- Scheduled branch -->
  <rect x="30" y="544" width="340" height="176" class="box phase"/>
  <text x="200" y="562" text-anchor="middle" class="label">Scheduled dataset (cron, or data_cycle)</text>
  <text x="50" y="582" class="detail">1. Compute (min, max) window from</text>
  <text x="60" y="596" class="detail">scheduled_dates_range(cron, scheduled_date)</text>
  <text x="50" y="614" class="detail">2. Adjust by previous_dag_checked (data_cycle)</text>
  <text x="50" y="630" class="detail">3. Extend by ±freshness if beyond_data_cycle</text>
  <text x="50" y="648" class="detail">4. Check the triggering event's date in range</text>
  <text x="50" y="666" class="detail">5. If not found: find_dataset_events</text>
  <text x="60" y="680" class="detail">(producing run's data_interval_end window)</text>
  <text x="50" y="698" class="detail">6. If still not found → missing_datasets</text>

  <!-- Non-scheduled branch -->
  <rect x="390" y="544" width="340" height="176" class="box phase"/>
  <text x="560" y="562" text-anchor="middle" class="label">Non-scheduled dataset that did not trigger</text>
  <text x="410" y="582" class="detail">1. Window (P_prev, U] on each event's own</text>
  <text x="420" y="596" class="detail">publication timestamp</text>
  <text x="410" y="614" class="detail">2. find_dataset_events_published(uri,</text>
  <text x="420" y="628" class="detail">timestamp_lte=U, timestamp_gt=P_prev)</text>
  <text x="410" y="646" class="detail">3. Retain the most recently published event</text>
  <text x="410" y="664" class="detail">4. A readable sl_scheduled_date raises</text>
  <text x="420" y="678" class="detail">max_scheduled_date (no freshness cap)</text>
  <text x="410" y="696" class="detail">5. No event in the window → missing_datasets</text>

  <!-- Lookup boxes -->
  <rect x="30" y="732" width="340" height="44" class="box db"/>
  <text x="200" y="750" text-anchor="middle" class="label">DatasetEvent ⋈ DagRun ⋈ DatasetModel</text>
  <text x="200" y="766" text-anchor="middle" class="detail">window on the producing run's data_interval_end</text>

  <rect x="390" y="732" width="340" height="44" class="box db"/>
  <text x="560" y="750" text-anchor="middle" class="label">DatasetEvent ⋈ DatasetModel</text>
  <text x="560" y="766" text-anchor="middle" class="detail">window on the event's own timestamp</text>

  <!-- Phase 6 labels -->
  <rect x="30" y="790" width="700" height="94" rx="6" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
  <text x="380" y="810" text-anchor="middle" class="label" font-size="13" fill="#374151">Phase 6: Result</text>

  <rect x="50" y="824" width="300" height="44" class="box result-ok"/>
  <text x="200" y="842" text-anchor="middle" class="label" fill="#166534">All datasets found</text>
  <text x="200" y="858" text-anchor="middle" class="detail" fill="#166534">XCom push start/end → Return True</text>

  <rect x="400" y="824" width="300" height="44" class="box result-skip"/>
  <text x="550" y="842" text-anchor="middle" class="label" fill="#991b1b">Missing datasets</text>
  <text x="550" y="858" text-anchor="middle" class="detail" fill="#991b1b">→ Return False (skip DAG execution)</text>

  <!-- XCom output -->
  <rect x="140" y="916" width="480" height="50" class="box xcom"/>
  <text x="380" y="934" text-anchor="middle" class="label" fill="#1e40af">XCom Output (on success)</text>
  <text x="380" y="952" text-anchor="middle" class="detail" fill="#1e40af">data_interval_start = previous_dag_checked  |  data_interval_end = max_scheduled_date</text>

  <line x1="200" y1="868" x2="300" y2="916" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Transport note -->
  <rect x="100" y="980" width="560" height="46" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="380" y="1000" text-anchor="middle" class="label" font-size="11" fill="#991b1b">Every lookup goes through StarlakeAirflowApiClient</text>
  <text x="380" y="1016" text-anchor="middle" class="detail" fill="#991b1b">one SQL query on Airflow 2 (REST v1 fallback) — paginated REST v2 on Airflow 3 (no DB access)</text>
</svg>
