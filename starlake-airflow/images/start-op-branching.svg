<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <style>
      .box { rx: 6; ry: 6; }
      .label { font-weight: 600; fill: #1e293b; }
      .sublabel { fill: #475569; font-size: 11px; }
      .condition { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .main { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .fallback { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Entry -->
  <rect x="240" y="10" width="240" height="44" class="box condition"/>
  <text x="360" y="28" text-anchor="middle" class="label">start_op()</text>
  <text x="360" y="44" text-anchor="middle" class="sublabel">task_id, scheduled, datasets...</text>

  <!-- Branch lines -->
  <line x1="320" y1="54" x2="190" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="54" x2="530" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch 1: dataset-aware start (every supported Airflow version) -->
  <rect x="40" y="110" width="300" height="80" class="box main"/>
  <text x="190" y="132" text-anchor="middle" class="label" font-size="12">Not cron-scheduled</text>
  <text x="190" y="148" text-anchor="middle" class="sublabel">and at least one dataset</text>
  <text x="190" y="164" text-anchor="middle" class="sublabel">every supported Airflow (2.5 → 3.x)</text>
  <line x1="190" y1="190" x2="190" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="230" width="300" height="50" class="box main"/>
  <text x="190" y="252" text-anchor="middle" class="label" font-size="11">ShortCircuitOperator</text>
  <text x="190" y="268" text-anchor="middle" class="sublabel">python_callable=should_continue</text>

  <!-- Branch 2: plain start task -->
  <rect x="380" y="110" width="300" height="80" class="box fallback"/>
  <text x="530" y="132" text-anchor="middle" class="label" font-size="12">Otherwise</text>
  <text x="530" y="148" text-anchor="middle" class="sublabel">cron-scheduled</text>
  <text x="530" y="164" text-anchor="middle" class="sublabel">or no datasets</text>
  <line x1="530" y1="190" x2="530" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="230" width="300" height="50" class="box fallback"/>
  <text x="530" y="252" text-anchor="middle" class="label" font-size="11">parent start_op()</text>
  <text x="530" y="268" text-anchor="middle" class="sublabel">returns dummy_op (an empty start task)</text>

  <!-- Note -->
  <rect x="60" y="296" width="600" height="44" rx="4" fill="#fff8e1" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4"/>
  <text x="360" y="314" text-anchor="middle" class="sublabel" fill="#92400e">not_scheduled + least_frequent + most_frequent datasets become the operator's inlets;</text>
  <text x="360" y="330" text-anchor="middle" class="sublabel" fill="#92400e">its metadata lookups go through StarlakeAirflowApiClient (database on Airflow 2, REST v2 on Airflow 3)</text>
</svg>
